<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breathe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breathe">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; color: #f5f5f5;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; -webkit-touch-callout: none;
  }
  body {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box; gap: 22px;
  }
  canvas { display: block; }
  .sets { display: flex; align-items: center; gap: 18px; }
  .sets button {
    width: 48px; height: 48px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08); color: #f5f5f5; font-size: 28px; line-height: 1; padding: 0;
    font-family: inherit;
  }
  .sets button:active { background: rgba(255,255,255,0.18); }
  .sets button:disabled { opacity: 0.3; }
  .sets .count { font-size: 22px; min-width: 96px; text-align: center; font-weight: 500; }
  .total { font-size: 15px; color: rgba(255,255,255,0.6); min-height: 1.2em; text-align: center; }
</style>
</head>
<body>
<canvas id="circle" aria-label="Breathing circle. Tap to start. Tap again to pause or resume."></canvas>
<div class="sets">
  <button id="less" aria-label="Fewer sets">&minus;</button>
  <div class="count" id="count">5 sets</div>
  <button id="more" aria-label="More sets">+</button>
</div>
<div class="total" id="total"></div>
<audio id="voice" playsinline preload="auto"></audio>
<script>
(function () {
  // ---- Exercise: Fibonacci from 13, 15 s rest between sets, 3-2-1 countdown.
  // The number of sets is yours (1-20) and is remembered on this phone. ----
  var FIB_START = 13, REST = 15, COUNTDOWN = 3, MIN_SETS = 1, MAX_SETS = 20, DEFAULT_SETS = 5;
  var FIB = [1, 2, 3, 5, 8, 13, 21, 34];
  var seq = FIB.filter(function (n) { return n <= FIB_START; }).reverse();   // 13, 8, 5, 3, 2, 1
  var CLIPS = ['inhale', 'exhale', 'rest', 'done', '1', '2', '3', '4', '5'];
  var TRACK_RATE = 16000;   // sample rate of the assembled voice track (speech only)

  var canvas = document.getElementById('circle'), ctx = canvas.getContext('2d');
  var audio = document.getElementById('voice');
  var lessBtn = document.getElementById('less'), moreBtn = document.getElementById('more');
  var countEl = document.getElementById('count'), totalEl = document.getElementById('total');

  function loadSets() { try { var v = parseInt(localStorage.getItem('breathe.sets'), 10); if (v >= MIN_SETS && v <= MAX_SETS) { return v; } } catch (e) {} return DEFAULT_SETS; }
  function saveSets(n) { try { localStorage.setItem('breathe.sets', String(n)); } catch (e) {} }
  var sets = loadSets();

  // ---- The timeline: every segment the circle draws, every word the voice says ----
  function buildSchedule(n) {
    var segs = [], cues = [], t = 0;
    segs.push({ t0: 0, t1: COUNTDOWN, name: 'countdown', secs: COUNTDOWN, hold: true, setsLeft: n });
    cues.push({ t: 0, clip: '3' }, { t: 1, clip: '2' }, { t: 2, clip: '1' });
    t = COUNTDOWN;
    for (var s = 0; s < n; s++) {
      var left = n - s;
      if (s > 0) {                                   // rest only between sets, counted down 5..1
        segs.push({ t0: t, t1: t + REST, name: 'Rest', secs: REST, hold: true, setsLeft: left });
        cues.push({ t: t, clip: 'rest' });
        for (var k = 5; k >= 1; k--) { cues.push({ t: t + REST - k, clip: String(k) }); }
        t += REST;
      }
      seq.forEach(function (nn) {
        segs.push({ t0: t, t1: t + nn, name: 'Inhale', secs: nn, hold: false, setsLeft: left }); cues.push({ t: t, clip: 'inhale' }); t += nn;
        segs.push({ t0: t, t1: t + nn, name: 'Exhale', secs: nn, hold: false, setsLeft: left }); cues.push({ t: t, clip: 'exhale' }); t += nn;
      });
    }
    cues.push({ t: t, clip: 'done' });
    return { segments: segs, cues: cues, end: t };
  }
  var sched = buildSchedule(sets);

  function fmt(secs) { var m = Math.floor(secs / 60), s = Math.round(secs - m * 60); return (m ? m + ' min ' : '') + s + ' s'; }
  function showSets() {
    countEl.textContent = sets + (sets === 1 ? ' set' : ' sets');
    totalEl.textContent = 'Total ' + fmt(sched.end - COUNTDOWN) + (trackReady() ? '' : ' · preparing voice…');
    lessBtn.disabled = sets <= MIN_SETS; moreBtn.disabled = sets >= MAX_SETS;
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: 'Breathe', artist: 'Fibonacci ' + FIB_START + ' · ' + sets + ' sets' }); } catch (e) {}
    }
  }

  // ---- Voice clips -> one continuous track for the chosen sets ----
  var AC = window.AudioContext || window.webkitAudioContext;
  var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  var clips = null, clipsPromise = null, trackUrl = null, trackSets = 0, renderPromise = null;

  function loadClips() {
    if (clipsPromise) { return clipsPromise; }
    var ac = new AC();
    clipsPromise = Promise.all(CLIPS.map(function (name) {
      return fetch('voice/' + name + '.m4a').then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
        return new Promise(function (res, rej) { ac.decodeAudioData(buf, res, rej); });
      });
    })).then(function (bufs) {
      clips = {}; CLIPS.forEach(function (n, i) { clips[n] = bufs[i]; });
      try { ac.close(); } catch (e) {}
      return clips;
    });
    return clipsPromise;
  }

  function wavBlob(buffer) {
    var ch = buffer.getChannelData(0), n = ch.length, out = new DataView(new ArrayBuffer(44 + n * 2));
    function str(o, s) { for (var i = 0; i < s.length; i++) { out.setUint8(o + i, s.charCodeAt(i)); } }
    str(0, 'RIFF'); out.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
    out.setUint32(24, buffer.sampleRate, true); out.setUint32(28, buffer.sampleRate * 2, true);
    out.setUint16(32, 2, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 2, true);
    for (var i = 0, o = 44; i < n; i++, o += 2) { var v = Math.max(-1, Math.min(1, ch[i])); out.setInt16(o, v < 0 ? v * 32768 : v * 32767, true); }
    return new Blob([out], { type: 'audio/wav' });
  }

  function renderTrack(n) {
    var sc = buildSchedule(n);
    var length = Math.ceil((sc.end + clips.done.duration + 0.5) * TRACK_RATE);
    var off = new OAC(1, length, TRACK_RATE);
    sc.cues.forEach(function (c) { var src = off.createBufferSource(); src.buffer = clips[c.clip]; src.connect(off.destination); src.start(c.t); });
    return new Promise(function (res) {
      off.oncomplete = function (e) { res(e.renderedBuffer); };
      var p = off.startRendering(); if (p && p.then) { p.then(res); }
    }).then(function (buf) {
      if (trackUrl) { try { URL.revokeObjectURL(trackUrl); } catch (e) {} }
      trackUrl = URL.createObjectURL(wavBlob(buf)); trackSets = n;
      return trackUrl;
    });
  }
  function trackReady() { return !!trackUrl && trackSets === sets; }
  function ensureTrack() {
    if (trackReady()) { return Promise.resolve(trackUrl); }
    var want = sets;
    renderPromise = loadClips().then(function () { return trackReady() ? trackUrl : renderTrack(want); }).then(function (u) { showSets(); return u; });
    return renderPromise;
  }

  // A silent clip: played inside the tap so iPhone lets the real track play a moment later
  function silence() {
    var n = TRACK_RATE / 10, out = new DataView(new ArrayBuffer(44 + n * 2));
    function str(o, s) { for (var i = 0; i < s.length; i++) { out.setUint8(o + i, s.charCodeAt(i)); } }
    str(0, 'RIFF'); out.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
    out.setUint32(24, TRACK_RATE, true); out.setUint32(28, TRACK_RATE * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
    str(36, 'data'); out.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([out], { type: 'audio/wav' }));
  }
  var SILENCE = silence();

  // ---- Playback: the audio element is the clock ----
  var phase = 'ready';   // ready | starting | playing | paused | done
  function start() {
    phase = 'starting';
    if (trackReady()) {
      audio.src = trackUrl; audio.currentTime = 0;
      audio.play().then(function () { phase = 'playing'; }).catch(function () { phase = 'ready'; draw(); });
    } else {
      audio.src = SILENCE; audio.play().catch(function () {});
      ensureTrack().then(function (url) {
        if (phase !== 'starting') { return; }
        audio.src = url; audio.currentTime = 0;
        audio.play().then(function () { phase = 'playing'; }).catch(function () { phase = 'ready'; draw(); });
      });
    }
    draw();
  }
  function tap() {
    if (phase === 'ready' || phase === 'done') { start(); }
    else if (phase === 'playing') { audio.pause(); }
    else if (phase === 'paused') { audio.play().catch(function () {}); }
  }
  audio.addEventListener('play', function () { if (audio.src !== SILENCE) { phase = 'playing'; keepAwake(); showSets(); draw(); } });
  audio.addEventListener('pause', function () { if (!audio.ended && phase === 'playing') { phase = 'paused'; letSleep(); draw(); } });
  audio.addEventListener('ended', function () { phase = 'done'; letSleep(); showSets(); draw(); });
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function () { if (phase === 'paused') { audio.play().catch(function () {}); } });
      navigator.mediaSession.setActionHandler('pause', function () { if (phase === 'playing') { audio.pause(); } });
    } catch (e) {}
  }

  // ---- Screen stays awake only while the session is playing in front ----
  var wakeLock = null;
  function keepAwake() { try { if ('wakeLock' in navigator) { navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {}); } } catch (e) {} }
  function letSleep() { try { if (wakeLock) { wakeLock.release(); } } catch (e) {} wakeLock = null; }
  document.addEventListener('visibilitychange', function () {
    // Away from the page the voice keeps going (it is audio); only the drawing stops.
    if (!document.hidden) { if (phase === 'playing') { keepAwake(); } draw(); }
  });

  // ---- Sets control (only while nothing is playing) ----
  function changeSets(delta) {
    if (phase === 'playing' || phase === 'paused' || phase === 'starting') { return; }
    var n = Math.max(MIN_SETS, Math.min(MAX_SETS, sets + delta));
    if (n === sets) { return; }
    sets = n; saveSets(n); sched = buildSchedule(n); showSets(); draw(); ensureTrack();
  }
  lessBtn.addEventListener('click', function () { changeSets(-1); });
  moreBtn.addEventListener('click', function () { changeSets(1); });
  canvas.addEventListener('click', tap);

  // ---- Drawing (mirrors the Mac app's circle), driven by the audio position ----
  var cssSize = 0;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    cssSize = Math.floor(Math.min(w * 0.86, h * 0.62));
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssSize + 'px'; canvas.style.height = cssSize + 'px';
    canvas.width = Math.round(cssSize * dpr); canvas.height = Math.round(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function segmentAt(t) {
    var segs = sched.segments;
    for (var i = 0; i < segs.length; i++) { if (t < segs[i].t1) { return segs[i]; } }
    return segs[segs.length - 1];
  }
  function triangle(cx, cy, d) {
    var h = d * 0.24, w = h * 0.87;
    ctx.beginPath(); ctx.moveTo(cx - w / 3, cy - h / 2); ctx.lineTo(cx + 2 * w / 3, cy); ctx.lineTo(cx - w / 3, cy + h / 2); ctx.closePath();
    ctx.fillStyle = '#f5f5f5'; ctx.fill();
  }
  function roundRect(x, y, w, h, color) {
    var rr = h / 2;
    ctx.beginPath(); ctx.moveTo(x + rr, y); ctx.lineTo(x + w - rr, y); ctx.arc(x + w - rr, y + rr, rr, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(x + rr, y + h); ctx.arc(x + rr, y + rr, rr, Math.PI / 2, Math.PI * 1.5); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }
  var FONT = '-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';
  function draw() {
    var side = cssSize; if (!side) { return; }
    var d = side * 0.96, cx = side / 2, cy = side / 2, r = d / 2;
    ctx.clearRect(0, 0, side, side);

    var centerText = '', subText = '', secondsText = '', showPlay = false, progress = 0, hold = false;
    if (phase === 'ready' || phase === 'starting') { showPlay = true; subText = sets + (sets === 1 ? ' set' : ' sets'); }
    else if (phase === 'done') { showPlay = true; subText = 'Done'; }
    else {
      var t = audio.currentTime || 0, sg = segmentAt(t);
      var raw = Math.max(0, Math.min(1, (t - sg.t0) / sg.secs));
      if (sg.name === 'countdown') { centerText = String(Math.max(1, Math.ceil(sg.t1 - t))); progress = raw; hold = true; }
      else {
        hold = sg.hold; centerText = sg.name; progress = sg.name === 'Exhale' ? 1 - raw : raw;
        subText = sg.setsLeft + (sg.setsLeft === 1 ? ' set left' : ' sets left');
        if (!sg.hold) { secondsText = String(sg.secs); }
      }
    }

    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(40,40,40,0.94)'; ctx.fill();

    var ar = r * 0.88;
    ctx.lineWidth = Math.max(6, side * 0.022); ctx.lineCap = 'round'; ctx.strokeStyle = '#f5f5f5';
    if (hold) { ctx.beginPath(); ctx.arc(cx, cy, ar, 0, Math.PI * 2); ctx.stroke(); }
    else if (progress > 0) { ctx.beginPath(); ctx.arc(cx, cy, ar, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress); ctx.stroke(); }

    if (showPlay) { triangle(cx, cy, d); }
    else {
      ctx.fillStyle = '#f5f5f5'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '500 ' + Math.round(d * 0.10) + 'px ' + FONT; ctx.fillText(centerText, cx, cy);
    }
    if (hold) {
      var bw = d * 0.55, bh = Math.max(6, d * 0.03), bx = cx - bw / 2, by = cy + d * 0.08;
      roundRect(bx, by, bw, bh, 'rgba(255,255,255,0.20)');
      if (progress > 0) { roundRect(bx, by, bw * progress, bh, 'rgba(255,255,255,0.63)'); }
    }
    if (secondsText) {
      ctx.fillStyle = 'rgba(245,245,245,0.85)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '500 ' + Math.round(d * 0.075) + 'px ' + FONT; ctx.fillText(secondsText, cx, cy + d * 0.125);
    }
    if (subText) {
      ctx.fillStyle = '#dcdcdc'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.font = Math.round(d * 0.045) + 'px ' + FONT; ctx.fillText(subText, cx, cy - r + d * 0.72);
    }
  }
  function frame() { if (phase === 'playing') { draw(); } requestAnimationFrame(frame); }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 50); });
  showSets(); resize(); requestAnimationFrame(frame);
  ensureTrack().catch(function () { totalEl.textContent = 'Total ' + fmt(sched.end - COUNTDOWN) + ' · voice unavailable'; });

  // Offline copy: the service worker keeps this page, its icons and the voice
  // clips on the phone, so the Home Screen icon works with no network at all.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
